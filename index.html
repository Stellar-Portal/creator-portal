<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stellar Advocates Portal">
<meta name="theme-color" content="#0626c7">
</head>
<body>
<title>Stellar Advocates Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column for creators (phone-first), a wider single column with list → detail for the team. */
:root {
  --bg: #f1f2f5; --surface: #ffffff; --surface-2: #f6f7f9; --line: #e0e2e9; --line-strong: #c9ccd6;
  --ink: #15161b; --muted: #5d6170; --faint: #8b8f9c;
  --accent: #d0216a; --accent-ink: #ffffff; --accent-soft: #fbe6ee;
  --ok: #187a4a; --ok-soft: #e1f3e8; --warn: #9a5b00; --warn-soft: #fbf0dc; --bad: #b42318; --bad-soft: #fde8e6;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px; --r-sm: 7px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1014; --surface: #17181e; --surface-2: #1d1f26; --line: #2a2d36; --line-strong: #3a3e4a;
  --ink: #eceef3; --muted: #a0a4b2; --faint: #747887;
  --accent: #ff5a96; --accent-ink: #1b0610; --accent-soft: #3a1527;
  --ok: #52c98a; --ok-soft: #14301f; --warn: #f0b252; --warn-soft: #33260f; --bad: #ff7a6b; --bad-soft: #3a1714;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1014; --surface: #17181e; --surface-2: #1d1f26; --line: #2a2d36; --line-strong: #3a3e4a;
  --ink: #eceef3; --muted: #a0a4b2; --faint: #747887;
  --accent: #ff5a96; --accent-ink: #1b0610; --accent-soft: #3a1527;
  --ok: #52c98a; --ok-soft: #14301f; --warn: #f0b252; --warn-soft: #33260f; --bad: #ff7a6b; --bad-soft: #3a1714;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1040px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.creator .top-in { max-width: 880px; }
.brand { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; font: 700 17px/1 var(--f-display); letter-spacing: -0.01em; }
.logo { height: 22px; width: auto; display: block; }
.logo-d { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo-l { display: none; } :root:not([data-theme="light"]) .logo-d { display: block; } }
:root[data-theme="dark"] .logo-l { display: none; }
:root[data-theme="dark"] .logo-d { display: block; }
.brand-sub { font: 600 13px/1 var(--f-body); color: var(--muted); padding-left: 10px; border-left: 1px solid var(--line-strong); letter-spacing: 0; }
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
.eq i { width: 3px; background: var(--accent); border-radius: 1px; display: block; }
.eq i:nth-child(1) { height: 55%; } .eq i:nth-child(2) { height: 100%; } .eq i:nth-child(3) { height: 35%; } .eq i:nth-child(4) { height: 75%; }
.badge { font: 600 11px/1 var(--f-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  border: 1px solid var(--line-strong); border-radius: 99px; padding: 5px 8px; }
.tabs { margin-left: auto; display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 99px; cursor: pointer; font-weight: 500; color: var(--muted); }
.tabs button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }

.wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 20px; }
.creator .wrap { max-width: 880px; }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(26px, 5vw, 34px); line-height: 1.1; }
h2 { font-size: 19px; line-height: 1.25; }
h3 { font-size: 16px; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 60ch; margin-top: 6px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.mono { font-family: var(--f-mono); font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-title { display: flex; align-items: baseline; gap: 8px; }
.count { font: 500 13px var(--f-mono); color: var(--faint); }

label.lbl { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.input, select.input, textarea.input { width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  padding: 9px 11px; min-height: 42px; min-width: 0; }
textarea.input { min-height: 96px; resize: vertical; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.input.small { min-height: 34px; padding: 5px 8px; font-size: 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: var(--r-sm); padding: 8px 14px; min-height: 40px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.active { background: var(--ok-soft); color: var(--ok); }
.pill.ended { background: var(--surface-2); color: var(--faint); border: 1px solid var(--line); }
.views { font: 500 12px var(--f-mono); padding: 2px 7px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.views.hit { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.views.flop { background: var(--bad-soft); color: var(--bad); border-color: transparent; }

/* creator: submit rows */
.pick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.acc-new { display: flex; gap: 6px; align-items: center; }
.acc-new .input { flex: 1; }
.ctabs { margin-left: 0; justify-self: start; }
.tab-n { font-size: 12px; color: var(--faint); margin-left: 2px; }
.link-rows { display: grid; gap: 8px; }
.lr-head, .link-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 190px) 178px 40px; gap: 8px; align-items: center; }
.camp-pick { max-width: 360px; }
.acc-new { display: flex; gap: 4px; align-items: center; min-width: 0; }
.acc-new .input { flex: 1; min-width: 0; }
.lr-head { font-size: 13px; font-weight: 600; align-items: end; white-space: nowrap; }
.lr-head .faint { font-size: 12px; }
.lr-top, .sub-m { display: none; }
.input.mono-date { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.input.bad { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.link-row .x { min-height: 42px; width: 40px; padding: 0; font-size: 22px; line-height: 1; }
input[type="date"].input { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; text-align: left; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; }
@media (max-width: 560px) {
  .pick-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .lr-head { display: none; }
  .link-rows { gap: 12px; }
  .link-row { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); }
  .lr-top { display: flex; justify-content: space-between; align-items: center; min-height: 32px; font-size: 13px; font-weight: 600; }
  .sub-m { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
  .link-row .x, .link-row .x-sp { display: none; }
  .post { grid-template-columns: 78px minmax(0, 1fr) auto; gap: 8px; }
  .post .when { font-size: 12px; }
}
.post-acts { display: flex; gap: 2px; }
.post.editing { grid-template-columns: minmax(0, 1fr); background: var(--surface-2); border-radius: var(--r-sm); padding: 12px; border-top: 0; margin: 4px 0; }
.ep-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 10px 0; }
.sub { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
@media (max-width: 560px) { .ep-grid { grid-template-columns: minmax(0, 1fr); } .post-acts { flex-direction: column; align-items: flex-end; } }
.install { display: grid; gap: 10px; background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; font-size: 14px; }
.install-head { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.install-head .x2 { margin-left: auto; flex: none; font-size: 18px; }
.install p { margin: 0; }
.install .inapp { background: var(--surface); border-radius: var(--r-sm); padding: 10px 12px; }
.install .ico { width: 18px; height: 18px; vertical-align: -3px; color: var(--accent); }
.seg { display: inline-flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 3px; justify-self: start; }
.seg button { border: 0; background: none; border-radius: 99px; padding: 5px 14px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.steps li { padding-left: 2px; }
.foot { text-align: center; font-size: 13px; color: var(--muted); }
.linkish { background: none; border: 0; padding: 0; color: inherit; font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
.camp-foot { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.camp h2 { font-size: 18px; }
.hint { font-size: 13px; color: var(--muted); }
.notice { border-radius: var(--r-sm); padding: 10px 12px; font-size: 14px; }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice ul { margin: 6px 0 0; padding-left: 18px; }

.camp-cards { display: grid; gap: 12px; }
.camp { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px 18px; display: grid; gap: 8px; }
.camp-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.brief { white-space: pre-wrap; color: var(--muted); font-size: 14px; }
.sound { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; font-size: 14px; color: var(--accent); text-decoration: none; }
.sound:hover { text-decoration: underline; }

.post-list { display: grid; }
.post { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.post:first-child { border-top: 0; }
.post .when { font: 500 13px var(--f-mono); color: var(--muted); }
.post .what { min-width: 0; }
.post .lk { font: 13px var(--f-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.post .meta { font-size: 12px; color: var(--faint); }

/* team: campaign list */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.summary { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.summary b { color: var(--ink); font: 600 15px var(--f-mono); }

.clist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.crow { display: grid; grid-template-columns: minmax(0, 2.2fr) 90px 80px 70px 110px 20px; gap: 12px; align-items: center; padding: 14px 18px;
  border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.crow:first-child { border-top: 0; }
.crow:hover { background: var(--surface-2); }
.crow.head { cursor: default; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); padding-block: 10px; background: var(--surface-2); }
.crow .nm { font-weight: 600; } .crow .ar { font-size: 13px; color: var(--muted); }
.crow .n { font: 500 14px var(--f-mono); }
.crow .chev { color: var(--faint); }
@media (max-width: 720px) {
  .crow { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; }
  .crow.head { display: none; }
  .crow .c-st { grid-column: 2; grid-row: 1; }
  .crow .c-n, .crow .c-l, .crow .c-last { grid-column: 1 / -1; font-size: 13px; }
  .crow .c-n::after { content: " creators"; } .crow .c-l::after { content: " links"; } .crow .c-last::before { content: "Last post "; color: var(--faint); }
  .crow .chev { display: none; }
  .crow .c-n, .crow .c-l, .crow .c-last { display: inline; }
  .crow-meta { grid-column: 1 / -1; display: flex; gap: 14px; }
}
@media (min-width: 721px) { .crow-meta { display: contents; } }

.back { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-weight: 500; justify-self: start; }
.back:hover { color: var(--ink); }
.detail-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.detail-head .row-actions { margin-left: auto; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); font-weight: 600; }
.stat .v { font: 600 26px/1.2 var(--f-display); font-variant-numeric: tabular-nums; margin-top: 4px; }

.people { display: flex; flex-wrap: wrap; gap: 8px; }
.person { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 99px; padding: 6px 12px 6px 8px; cursor: pointer; user-select: none; font-weight: 500; font-size: 14px; background: var(--surface); }
.person input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.person.on { border-color: var(--accent); background: var(--accent-soft); }
.person .p-note { font-size: 12px; font-weight: 500; color: var(--muted); }
.person.quiet { border-color: var(--bad); background: var(--bad-soft); }
.person.quiet .p-note { color: var(--bad); font-weight: 600; }
.camp-hint { margin-top: -6px; }
.target { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.t-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 2px; }
.t-k { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.t-v { font: 600 22px/1.2 var(--f-display); }
.t-s { font-size: 13px; color: var(--muted); }
.t-s.over { color: var(--bad); }
.t-box .pbar { margin-top: 6px; }
.mpick { display: grid; gap: 10px; }
.search-wrap { position: relative; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.suggest:empty { display: none; margin: 0; }
.sug { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-weight: 500; font-size: 14px; }
.sug:hover, .sug:focus-visible, .sug.first { border-color: var(--accent); background: var(--accent-soft); }
.sug::before { content: "+ "; color: var(--accent); font-weight: 700; }
.sug-empty { font-size: 13px; color: var(--muted); padding: 4px 2px; }
.mlist { display: grid; gap: 6px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 140px 36px; gap: 8px; align-items: center; padding: 6px 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); }
.mrow.mhead { background: none; border: 0; padding: 0 10px; font-size: 12px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
.mrow .mname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .input.small { width: 100%; }
.mrow .x { font-size: 18px; padding: 0; min-height: 32px; }
.mfoot { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.assign { font-size: 14px; }
.over { color: var(--bad); font-weight: 600; }
.ok-txt { color: var(--ok); font-weight: 600; }
.stat .of { font-size: 16px; color: var(--faint); font-weight: 500; }
.stat .sub2 { font-size: 13px; color: var(--muted); margin-top: 2px; }
.stat .sub2.over { color: var(--bad); }
.prog { display: grid; }
.prow { display: grid; grid-template-columns: minmax(90px, 1fr) 70px minmax(80px, 160px) minmax(0, 2fr); gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow .pname { font-weight: 600; }
.prow .pcount { font: 500 14px var(--f-mono); }
.pbar { height: 6px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.prow .pstat { font-size: 13px; color: var(--muted); }
.prow.bad .pname, .prow.bad .pstat { color: var(--bad); }
.prow.bad .pstat { font-weight: 600; }
.prow.bad .pbar i { background: var(--bad); }
.prow.done .pbar i { background: var(--ok); }
.prow.done .pstat { color: var(--ok); font-weight: 600; }
@media (max-width: 640px) {
  .prow { grid-template-columns: minmax(0, 1fr) auto; row-gap: 6px; }
  .prow .pbar { grid-column: 1 / -1; }
  .prow .pstat { grid-column: 1 / -1; }
  .mrow { grid-template-columns: minmax(0, 1fr) 96px 32px; }
}
.quiet-note { font-size: 12px; font-weight: 600; color: var(--bad); }
.notice b { font-weight: 600; }

.table-wrap { overflow-x: auto; margin-inline: -20px; padding-inline: 20px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.lk a { font: 13px var(--f-mono); white-space: nowrap; }

  /* ── creator page ──────────────────────────────────────── */
  function creatorPage() {
    var d = S.data, tab = S.ctab || 'send';
    var active = d.campaigns.filter(function (c) { return c.status === 'Active'; });
    if (!active.some(function (c) { return c.id === S.campaign; })) S.campaign = active.length === 1 ? active[0].id : '';
    var h = '<header class="top"><div class="top-in">' + brand() + '</div></header><main class="wrap">';
    h += '<section><h1>Hi, ' + esc(d.name) + '</h1><p class="lede">Only you and the Stellar team can see this page.</p></section>';
    h += installTip();
    var missing = missingLogins().length, fresh = d.campaigns.filter(isNewCampaign).length;
    h += '<nav class="tabs ctabs" aria-label="Sections">' + [['send', 'Send links'], ['campaigns', 'Campaigns'], ['posts', 'My posts'], ['details', 'My details']].map(function (t) {
      var n = t[0] === 'campaigns' ? d.campaigns.length : t[0] === 'posts' ? d.posts.length : 0;
      var dot = t[0] === 'details' && missing ? '<span class="tab-dot" aria-label="' + plural(missing, 'login') + ' to add">' + missing + '</span>'
        : t[0] === 'campaigns' && fresh ? '<span class="tab-dot" aria-label="' + plural(fresh, 'new campaign') + '">' + fresh + '</span>' : '';
      return '<button type="button" data-act="ctab" data-v="' + t[0] + '"' + (tab === t[0] ? ' aria-current="page"' : '') + '>' + t[1] + (n && !dot ? ' <span class="num tab-n">' + n + '</span>' : '') + dot + '</button>';
    }).join('') + '</nav>';

    if (tab === 'send') {
      h += '<section class="card" aria-label="Send links">';
      if (!active.length) {
        h += '<div class="empty">You’re not on an active campaign right now. The team will add you when one starts.</div>';
      } else {
        var accs = d.accounts;
        S.rows.forEach(function (r) { if (r.account == null) r.account = defaultAccount(); });
        h += '<div class="camp-pick"><label class="lbl" for="f-campaign">Campaign</label><select class="input" id="f-campaign" data-k="campaign">' +
          (active.length > 1 ? '<option value="">Choose a campaign…</option>' : '') +
          active.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === S.campaign ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select></div>';
        var cur = active.filter(function (c) { return c.id === S.campaign; })[0];
        if (cur && (toInt(cur.myVideos) || cur.deadline)) {
          var sent = d.posts.filter(function (p) { return p.campaignId === cur.id; }).length, tg = toInt(cur.myVideos);
          h += '<p class="hint camp-hint">' + [tg ? sent + ' of ' + tg + ' videos sent' : '', cur.deadline ? 'deadline ' + fmtDate(cur.deadline) : ''].filter(Boolean).join(' · ') + '</p>';
        }
        h += '<div class="link-rows"><div class="lr-head" aria-hidden="true"><span>Link to your post</span><span>Posted from' + (accs.length ? '' : ' <span class="faint" style="font-weight:400">(optional)</span>') + '</span><span>Date posted <span class="faint" style="font-weight:400">DD/MM/YYYY</span></span><span></span></div>' + S.rows.map(rowHtml).join('') + '</div>';
        if (!accs.length) h += '<p class="hint">Type your account once and it’s saved for next time.</p>';

  /**
   * Where one creator stands on one campaign.
   * With an amount of videos + a campaign deadline: the clock runs from the day they were added

   * Without those: falls back to "no post in 7+ days".

  function standing(c, m) {
    var today = todayIso(), quota = toInt(m.videos);
    var mine = postsOf(c.id).filter(function (p) { return p.creatorId === m.creatorId; });
    var posted = mine.length, last = mine.map(function (p) { return p.postedOn; }).sort().pop() || '';
    var r = { creator: creatorById(m.creatorId), quota: quota, posted: posted, last: last, flag: false, kind: 'ok', text: '' };
    if (quota && posted >= quota) { r.kind = 'done'; r.text = 'Done'; return r; }
    if (quota && c.deadline) {
      var start = m.added && m.added <= c.deadline ? m.added : (c.created && c.created <= c.deadline ? c.created : today);
      var span = Math.max(1, daysBetween(start, c.deadline));

      if (daysLeft < 0) { r.flag = true; r.kind = 'missed'; r.text = 'Missed the deadline · ' + left + ' still to post'; return r; }
      var need = daysLeft <= 7 ? left + ' more by ' + fmtDate(c.deadline) : '~' + Math.ceil(left / (daysLeft / 7)) + ' a week';
      if (posted < expected) { r.flag = true; r.kind = 'behind'; r.text = 'Behind · should have ' + expected + ' by now · needs ' + need; }

    'cancel-edit': function () { S.edit = null; render(); },
    'save-campaign': function () {
      var e = S.edit; if (!String(e.name || '').trim()) { toast('Give the campaign a name.', true); return; }
      if (assignState(e).over) { toast('You’ve assigned more videos than the campaign total.', true); return; }
      var badSnd = e.sounds.filter(function (x) { return String(x.url || '').trim() && !isUrl(x.url); })[0];
      if (badSnd) { toast('Sound links should start with https://', true); return; }
      var payload = { id: e.id, name: e.name, artist: e.artist, brief: e.brief, status: e.status, deadline: e.deadline, totalVideos: e.totalVideos, notify: !!e.notify,
        sounds: e.sounds.map(function (x) { return { label: String(x.label || '').trim(), url: String(x.url || '').trim() }; }).filter(function (x) { return x.label || x.url; }),
        members: e.members.map(function (m) { return { creatorId: m.creatorId, videos: m.videos }; }) };
      call('adminSaveCampaign', [S.key, payload], function (d) {
        if (!e.id) { var created = d.campaigns.filter(function (c) { return c.name === e.name.trim(); }).pop(); if (created) S.campaignId = created.id; S.filter = e.status === 'Ended' ? 'Ended' : 'Active'; }
        S.edit = null; setData(d);
        var em = d.emailed, bits = [];
        if (em && em.sent.length) bits.push('emailed ' + em.sent.join(', '));
        if (em && em.noEmail.length) bits.push(em.noEmail.join(', ') + ' ha' + (em.noEmail.length > 1 ? 've' : 's') + ' no email');
        if (em && em.failed.length) bits.push('couldn’t email ' + em.failed.join(', '));
        toast((e.id ? 'Saved' : 'Campaign created') + (bits.length ? ' · ' + bits.join(' · ') : ''));
      });
    },
    'del-campaign': function () { if (!arm('delc:' + S.campaignId)) return; call('adminDeleteCampaign', [S.key, S.campaignId], function (d) { S.campaignId = null; setData(d); toast('Campaign deleted'); }); },
    'del-post': function (el) { if (!arm('delp:' + el.dataset.id)) return; call('adminDeletePost', [S.key, el.dataset.id], function (d) { setData(d); toast('Link deleted'); }); },
    'copy-links': function () {
      var who = S.postCreator, list = postsOf(S.campaignId).filter(function (p) { return !who || p.creatorId === who; });
      copy(list.map(function (p) { return p.link; }).join('\n'));
    },
    'add-creator': function () {
      var el = document.getElementById('new-creator'), name = el && el.value.trim();
      if (!name) { toast('Type a name first.', true); return; }
      call('adminSaveCreator', [S.key, { name: name }], function (d) { setData(d); toast(name + ' added. Copy their link and send it to them.'); });
    },
    'save-appurl': function () {
      var el = document.getElementById('app-url'), v = el && el.value.trim();
      if (!v) { toast('Paste the Web app URL first.', true); return; }
      call('adminSetAppUrl', [S.key, v], function (d) { setData(d); toast('Saved. Creator links are ready to copy.'); });
    },
    'copy-link': function (el) { var cr = creatorById(el.dataset.id); copy(cr.link, 'lk-' + cr.id); },
    'rename': function (el) { S.editCreator = el.dataset.id; render(); var i = document.getElementById('rn-' + el.dataset.id); if (i) { i.focus(); i.select(); } },
    'save-name': function (el) {
      var i = document.getElementById('rn-' + el.dataset.id), ac = document.getElementById('ac-' + el.dataset.id), cr = creatorById(el.dataset.id);
      call('adminSaveCreator', [S.key, { id: cr.id, name: i.value, notes: cr.notes, accounts: ac ? ac.value : cr.accounts }], function (d) { S.editCreator = null; setData(d); toast('Saved'); });
    },
    'cancel-cr': function () { S.editCreator = null; render(); },
    'reset': function (el) { if (!arm('reset:' + el.dataset.id)) return; call('adminResetLink', [S.key, el.dataset.id], function (d) { setData(d); toast('New link made. Send it to them; the old one no longer works.'); }); },
    'del-creator': function (el) { if (!arm('delcr:' + el.dataset.id)) return; call('adminDeleteCreator', [S.key, el.dataset.id], function (d) { S.creatorId = null; setData(d); toast('Creator deleted'); }); },
    'open-cr': function (el) { S.view = 'creators'; S.creatorId = el.dataset.id; S.crEdit = null; S.alForm = null; S.armed = null; render(); window.scrollTo(0, 0); },
    'back-cr': function () { S.creatorId = null; S.crEdit = null; S.alForm = null; render(); },
    'group-filter': function (el) { S.group = el.dataset.v; render(); },
    'edit-cr': function () {
      var cr = creatorById(S.creatorId); if (!cr) return;
      S.crEdit = { id: cr.id, origName: cr.name, name: cr.name, email: cr.email || '', notes: cr.notes || '', payStart: cr.payStart || '',
        accounts: (cr.accounts || []).map(function (a) { return '@' + a; }).join(', '), tags: (cr.tags || []).join(', ') };
      render(); window.scrollTo(0, 0); var i = document.getElementById('ce-name'); if (i) i.focus();
    },
    'cancel-cr-edit': function () { S.crEdit = null; render(); },
    'tag-add': function (el) {
      var e = S.crEdit; if (!e) return;
      var cur = String(e.tags || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
      cur.push(el.dataset.tag); e.tags = cur.join(', '); render();
    },
    'save-cr': function () {
      var e = S.crEdit; if (!e) return;
      if (!String(e.name).trim()) { toast('Add a name.', true); return; }
      if (e.email.trim() && !/^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/.test(e.email.trim())) { toast('That email address doesn’t look right.', true); return; }
      call('adminSaveCreator', [S.key, { id: e.id, name: e.name, email: e.email.trim(), notes: e.notes, payStart: e.payStart, accounts: e.accounts, tags: e.tags }],
        function (d) { S.crEdit = null; setData(d); toast('Saved'); });
    },
    'pay': function (el) {
      var cr = creatorById(el.dataset.id), how = el.dataset.how, when = cr && cr.pay ? (how === 'undo' ? cr.pay.lastPaid : cr.pay.next) : '';
      call('adminSetPaid', [S.key, el.dataset.id, how], function (d) {
        setData(d); toast(how === 'undo' ? 'Undone: ' + fmtDate(when) + ' is unpaid again' : cr.name + ' marked paid for ' + fmtDate(when));
      });
    },
    'pin-show': function (el) {
      var inp = document.getElementById('pin'), pin = inp ? inp.value.trim() : S.pin, cid = el.dataset.id;
      if (!pin) { toast('Type the logins PIN first.', true); if (inp) inp.focus(); return; }
      call('adminLogins', [S.key, pin, cid], function (rows) { S.pin = pin; S.secrets = S.secrets || {}; S.secrets[cid] = rows; render(); });
    },
    'pin-hide': function () { S.secrets = {}; S.pin = null; S.alForm = null; render(); },
    'lg-unlock': function (el) { call('adminSetLoginStatus', [S.key, el.dataset.id, true], function (d) { setData(d); toast('Unlocked. They can now send the new login from their page.'); }); },
    'lg-lock': function (el) { call('adminSetLoginStatus', [S.key, el.dataset.id, false], function (d) { setData(d); toast('Locked again'); }); },
    'show-old': function (el) { S.showOld = S.showOld || {}; S.showOld[el.dataset.k] = !S.showOld[el.dataset.k]; render(); },
    'copy-val': function (el) { copy(el.dataset.v); },
    'al-open': function (el) {
      var cid = el.dataset.cid, acc = el.dataset.acc;
      var cur = ((S.secrets && S.secrets[cid]) || []).filter(function (x) { return x.account.toLowerCase() === acc.toLowerCase() && x.status !== 'old'; })[0] || {};
      S.alForm = { creatorId: cid, account: acc, login: cur.login || '', password: cur.password || '', emailPassword: cur.emailPassword || '', notes: cur.notes || '' };
      render(); var i = document.getElementById('al-login'); if (i) i.focus();
    },
    'al-new': function (el) { S.alForm = { creatorId: el.dataset.cid, isNew: true, account: '', login: '', password: '', emailPassword: '', notes: '' }; render(); var i = document.getElementById('al-acc'); if (i) i.focus(); },
    'al-cancel': function () { S.alForm = null; render(); },
    'al-save': function () {
      var f = S.alForm; if (!f) return;
      var acc = String(f.account || '').trim().replace(/^@+/, '');
      if (!acc) { toast('Add the account name.', true); return; }
      call('adminSaveLogin', [S.key, S.pin, f.creatorId, { account: acc, login: f.login, password: f.password, emailPassword: f.emailPassword, notes: f.notes }], function (r) {
        S.secrets[f.creatorId] = r.logins; S.alForm = null; setData(r.view); toast('Login saved for @' + acc);
      });
    }
  };
  app.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.dataset.act === 'member') return;
    if (S.busy) return;
    var fn = actions[el.dataset.act]; if (fn) { ev.preventDefault(); fn(el); }
  });
  app.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.dataset.act === 'member') {
      var on = el.checked;
      el.closest('.person').classList.toggle('on', on);
      call('adminSetMember', [S.key, S.campaignId, el.dataset.id, on], function (d) { var cr = creatorById(el.dataset.id); setData(d); toast((cr ? cr.name : 'Creator') + (on ? ' added to' : ' removed from') + ' this campaign'); });
      return;
    }
    if (el.dataset.views) {
      var p = S.data.posts.filter(function (x) { return x.id === el.dataset.views; })[0];
      if (p && p.views !== el.value.trim()) call('adminUpdatePost', [S.key, p.id, { views: el.value.trim() }], function (d) { S.data = d; toast('Views saved'); });
      return;
    }
    if (el.id === 'e-notify' && S.edit) { S.edit.notify = el.checked; render(); return; }
    if (el.dataset.k === 'campaign') { S.campaign = el.value; S.result = null; render(); return; }
    if (el.dataset.k === 'ep-acc' && S.editPost) {
      if (el.value === '__new') { S.editPost.newAcc = true; S.editPost.account = ''; render(); var na = document.getElementById('ep-acc'); if (na) na.focus(); }
      else S.editPost.account = el.value;
      return;
    }
    if (el.dataset.k === 'ep-date' && S.editPost) { S.editPost.postedOn = el.value; return; }
    if (el.dataset.k === 'acc' && S.rows[+el.dataset.i]) {
      var row = S.rows[+el.dataset.i], idx = +el.dataset.i;
      if (el.value === '__new') { row.newAcc = true; row.account = ''; render(); var n = document.getElementById('acc-' + idx); if (n) n.focus(); }
      else row.account = el.value;
      return;
    }
    if (el.dataset.k === 'postCreator') { S.postCreator = el.value; render(); return; }
    if (el.dataset.e) { S.edit[el.dataset.e] = el.value; }
  });
  app.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.id === 'e-search' && S.edit) { S.edit.q = el.value; S.sugOpen = true; refreshSuggest(); return; }
    if (el.dataset.mv && S.edit) {
      S.edit.members.forEach(function (m) { if (m.creatorId === el.dataset.mv) m.videos = el.value; });
      refreshAssign(); return;
    }
    if (el.dataset.e && S.edit) { S.edit[el.dataset.e] = el.value; if (el.dataset.e === 'totalVideos') refreshAssign(); return; }
    if (el.dataset.lg && S.loginForm) { S.loginForm[el.dataset.lg] = el.value; return; }
    if (el.dataset.ce && S.crEdit) { S.crEdit[el.dataset.ce] = el.value; return; }
    if (el.dataset.al && S.alForm) { S.alForm[el.dataset.al] = el.value; return; }
    if (el.dataset.snd && S.edit) { S.edit.sounds[+el.dataset.i][el.dataset.snd] = el.value; return; }
    if (el.dataset.k === 'ep-acc-text' && S.editPost) { S.editPost.account = el.value.trim().replace(/^@+/, ''); return; }
    if (el.dataset.k === 'ep-date' && S.editPost) { S.editPost.postedOn = el.value; return; }
    if (el.dataset.k === 'accText' && S.rows[+el.dataset.i]) { S.rows[+el.dataset.i].account = el.value.trim().replace(/^@+/, ''); return; }
    if (el.dataset.k === 'dateText' && S.rows[+el.dataset.i]) {
      var dg = el.value.replace(/\D/g, '').slice(0, 8);
      var f = dg.slice(0, 2) + (dg.length > 2 ? '/' + dg.slice(2, 4) : '') + (dg.length > 4 ? '/' + dg.slice(4) : '');
      if (f !== el.value) el.value = f;
      var row = S.rows[+el.dataset.i]; row.dateText = f; row.date = fromDmy(f);
      if (row.dateBad && row.date) { row.dateBad = false; el.classList.remove('bad'); }
      return;
    }
    if (el.dataset.k && el.dataset.i != null && S.rows[+el.dataset.i]) {
      S.rows[+el.dataset.i][el.dataset.k] = el.value;
      if (el.dataset.k === 'link') {
        var n = S.rows.filter(function (r) { return r.link.trim(); }).length, btn = document.getElementById('submit-btn');
        if (btn) { btn.disabled = !n; btn.textContent = n > 1 ? 'Send ' + n + ' links' : 'Send link'; }
      }
    }
  });
  app.addEventListener('focusout', function (ev) {
    var el = ev.target;
    if (el.dataset && el.dataset.k === 'dateText' && S.rows[+el.dataset.i]) {
      var row = S.rows[+el.dataset.i];
      row.dateBad = !!(row.dateText && !row.date) || (row.date > todayIso());
      el.classList.toggle('bad', row.dateBad);
    }
  });
  app.addEventListener('paste', function (ev) {
    var el = ev.target;
    if (el.dataset.k !== 'link') return;
    var text = (ev.clipboardData || window.clipboardData).getData('text') || '';
    var urls = text.match(/https?:\/\/[^\s,;]+/gi) || [];
    if (urls.length < 2) return;
    ev.preventDefault();
    var i = +el.dataset.i, base = S.rows[i];
    var fresh = urls.map(function (u) { return { link: u, date: base.date || todayIso(), account: base.account, newAcc: base.newAcc }; });
    S.rows.splice.apply(S.rows, [i, 1].concat(fresh));
    S.result = null; render();
    toast(urls.length + ' links added. Check the dates before sending.');
  });
  app.addEventListener('focusin', function (ev) {
    if (ev.target.id === 'e-search' && S.edit) { S.sugOpen = true; refreshSuggest(); }
  });
  app.addEventListener('focusout', function (ev) {
    if (ev.target.id === 'e-search') setTimeout(function () {
      var a = document.activeElement;
      if (a && a.closest && a.closest('.search-wrap')) return;
      S.sugOpen = false; refreshSuggest();
    }, 120);
  });
  // keep focus in the search box while picking a suggestion
  app.addEventListener('mousedown', function (ev) { if (ev.target.closest && ev.target.closest('.sug')) ev.preventDefault(); });
  app.addEventListener('keydown', function (ev) {
    if (ev.target.id === 'e-search') {
      if (ev.key === 'Enter') { ev.preventDefault(); var first = document.querySelector('#e-suggest .sug'); if (first) actions['m-add'](first); }
      if (ev.key === 'Escape') { S.edit.q = ''; ev.target.value = ''; S.sugOpen = false; refreshSuggest(); }
      if (ev.key === 'ArrowDown') { var f = document.querySelector('#e-suggest .sug'); if (f) { ev.preventDefault(); f.focus(); } }
    }
    if (ev.target.classList && ev.target.classList.contains('sug')) {
      if (ev.key === 'ArrowDown' && ev.target.nextElementSibling && ev.target.nextElementSibling.classList.contains('sug')) { ev.preventDefault(); ev.target.nextElementSibling.focus(); }
      if (ev.key === 'ArrowUp') { ev.preventDefault(); (ev.target.previousElementSibling || document.getElementById('e-search')).focus(); }
    }
    if (ev.key === 'Enter' && ev.target.id === 'new-creator') { ev.preventDefault(); actions['add-creator'](); }
    if (ev.key === 'Enter' && ev.target.id === 'pin') { ev.preventDefault(); var b = document.querySelector('[data-act="pin-show"]'); if (b) actions['pin-show'](b); }
    if (ev.key === 'Enter' && ev.target.id && (ev.target.id.indexOf('rn-') === 0 || ev.target.id.indexOf('ac-') === 0)) { ev.preventDefault(); actions['save-name']({ dataset: { id: ev.target.id.slice(3) } }); }
    if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.views) { ev.target.blur(); }
  });

  if (window.PREVIEW && window.PREVIEW.ready) window.PREVIEW.ready(start);
  else start(readBoot());
})();
</script>

</body>
</html>
