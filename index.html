<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<title>Creator Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column for creators (phone-first), a wider single column with list → detail for the team. */
:root {
  --bg: #f1f2f5; --surface: #ffffff; --surface-2: #f6f7f9; --line: #e0e2e9; --line-strong: #c9ccd6;
  --ink: #15161b; --muted: #5d6170; --faint: #8b8f9c;
  --accent: #d0216a; --accent-ink: #ffffff; --accent-soft: #fbe6ee;
  --ok: #187a4a; --ok-soft: #e1f3e8; --warn: #9a5b00; --warn-soft: #fbf0dc; --bad: #b42318; --bad-soft: #fde8e6;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px; --r-sm: 7px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1014; --surface: #17181e; --surface-2: #1d1f26; --line: #2a2d36; --line-strong: #3a3e4a;
  --ink: #eceef3; --muted: #a0a4b2; --faint: #747887;
  --accent: #ff5a96; --accent-ink: #1b0610; --accent-soft: #3a1527;
  --ok: #52c98a; --ok-soft: #14301f; --warn: #f0b252; --warn-soft: #33260f; --bad: #ff7a6b; --bad-soft: #3a1714;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f1014; --surface: #17181e; --surface-2: #1d1f26; --line: #2a2d36; --line-strong: #3a3e4a;
  --ink: #eceef3; --muted: #a0a4b2; --faint: #747887;
  --accent: #ff5a96; --accent-ink: #1b0610; --accent-soft: #3a1527;
  --ok: #52c98a; --ok-soft: #14301f; --warn: #f0b252; --warn-soft: #33260f; --bad: #ff7a6b; --bad-soft: #3a1714;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1040px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.creator .top-in { max-width: 880px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 17px/1 var(--f-display); letter-spacing: -0.01em; }
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
.eq i { width: 3px; background: var(--accent); border-radius: 1px; display: block; }
.eq i:nth-child(1) { height: 55%; } .eq i:nth-child(2) { height: 100%; } .eq i:nth-child(3) { height: 35%; } .eq i:nth-child(4) { height: 75%; }
.badge { font: 600 11px/1 var(--f-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  border: 1px solid var(--line-strong); border-radius: 99px; padding: 5px 8px; }
.tabs { margin-left: auto; display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 99px; cursor: pointer; font-weight: 500; color: var(--muted); }
.tabs button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }

.wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 20px; }
.creator .wrap { max-width: 880px; }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(26px, 5vw, 34px); line-height: 1.1; }
h2 { font-size: 19px; line-height: 1.25; }
h3 { font-size: 16px; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 60ch; margin-top: 6px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.mono { font-family: var(--f-mono); font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.section-title { display: flex; align-items: baseline; gap: 8px; }
.count { font: 500 13px var(--f-mono); color: var(--faint); }

label.lbl { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.input, select.input, textarea.input { width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  padding: 9px 11px; min-height: 42px; min-width: 0; }
textarea.input { min-height: 96px; resize: vertical; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.input.small { min-height: 34px; padding: 5px 8px; font-size: 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: var(--r-sm); padding: 8px 14px; min-height: 40px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.active { background: var(--ok-soft); color: var(--ok); }
.pill.ended { background: var(--surface-2); color: var(--faint); border: 1px solid var(--line); }
.views { font: 500 12px var(--f-mono); padding: 2px 7px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.views.hit { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.views.flop { background: var(--bad-soft); color: var(--bad); border-color: transparent; }

/* creator: submit rows */
.pick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.acc-new { display: flex; gap: 6px; align-items: center; }
.acc-new .input { flex: 1; }
.ctabs { margin-left: 0; justify-self: start; }
.tab-n { font-size: 12px; color: var(--faint); margin-left: 2px; }
.link-rows { display: grid; gap: 8px; }
.lr-head, .link-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 190px) 178px 40px; gap: 8px; align-items: center; }
.camp-pick { max-width: 360px; }
.acc-new { display: flex; gap: 4px; align-items: center; min-width: 0; }
.acc-new .input { flex: 1; min-width: 0; }
.lr-head { font-size: 13px; font-weight: 600; align-items: end; white-space: nowrap; }
.lr-head .faint { font-size: 12px; }
.lr-top, .sub-m { display: none; }
.input.mono-date { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.input.bad { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.link-row .x { min-height: 42px; width: 40px; padding: 0; font-size: 22px; line-height: 1; }
input[type="date"].input { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 0; text-align: left; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; }
@media (max-width: 560px) {
  .pick-grid { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .lr-head { display: none; }
  .link-rows { gap: 12px; }
  .link-row { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); }
  .lr-top { display: flex; justify-content: space-between; align-items: center; min-height: 32px; font-size: 13px; font-weight: 600; }
  .sub-m { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
  .link-row .x, .link-row .x-sp { display: none; }
  .post { grid-template-columns: 78px minmax(0, 1fr) auto; gap: 8px; }
  .post .when { font-size: 12px; }
}
.linkish { background: none; border: 0; padding: 0; color: inherit; font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
.camp-foot { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.camp h2 { font-size: 18px; }
.hint { font-size: 13px; color: var(--muted); }
.notice { border-radius: var(--r-sm); padding: 10px 12px; font-size: 14px; }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice ul { margin: 6px 0 0; padding-left: 18px; }

.camp-cards { display: grid; gap: 12px; }
.camp { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px 18px; display: grid; gap: 8px; }
.camp-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.brief { white-space: pre-wrap; color: var(--muted); font-size: 14px; }
.sound { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; font-size: 14px; color: var(--accent); text-decoration: none; }
.sound:hover { text-decoration: underline; }

.post-list { display: grid; }
.post { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.post:first-child { border-top: 0; }
.post .when { font: 500 13px var(--f-mono); color: var(--muted); }
.post .what { min-width: 0; }
.post .lk { font: 13px var(--f-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.post .meta { font-size: 12px; color: var(--faint); }

/* team: campaign list */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.summary { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.summary b { color: var(--ink); font: 600 15px var(--f-mono); }

.clist { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.crow { display: grid; grid-template-columns: minmax(0, 2.2fr) 90px 80px 70px 110px 20px; gap: 12px; align-items: center; padding: 14px 18px;
  border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.crow:first-child { border-top: 0; }
.crow:hover { background: var(--surface-2); }
.crow.head { cursor: default; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); padding-block: 10px; background: var(--surface-2); }
.crow .nm { font-weight: 600; } .crow .ar { font-size: 13px; color: var(--muted); }
.crow .n { font: 500 14px var(--f-mono); }
.crow .chev { color: var(--faint); }
@media (max-width: 720px) {
  .crow { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; }
  .crow.head { display: none; }
  .crow .c-st { grid-column: 2; grid-row: 1; }
  .crow .c-n, .crow .c-l, .crow .c-last { grid-column: 1 / -1; font-size: 13px; }
  .crow .c-n::after { content: " creators"; } .crow .c-l::after { content: " links"; } .crow .c-last::before { content: "Last post "; color: var(--faint); }
  .crow .chev { display: none; }
  .crow .c-n, .crow .c-l, .crow .c-last { display: inline; }
  .crow-meta { grid-column: 1 / -1; display: flex; gap: 14px; }
}
@media (min-width: 721px) { .crow-meta { display: contents; } }

.back { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-weight: 500; justify-self: start; }
.back:hover { color: var(--ink); }
.detail-head { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.detail-head .row-actions { margin-left: auto; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); font-weight: 600; }
.stat .v { font: 600 26px/1.2 var(--f-display); font-variant-numeric: tabular-nums; margin-top: 4px; }

.people { display: flex; flex-wrap: wrap; gap: 8px; }
.person { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 99px; padding: 6px 12px 6px 8px; cursor: pointer; user-select: none; font-weight: 500; font-size: 14px; background: var(--surface); }
.person input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.person.on { border-color: var(--accent); background: var(--accent-soft); }

.table-wrap { overflow-x: auto; margin-inline: -20px; padding-inline: 20px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.lk a { font: 13px var(--f-mono); white-space: nowrap; }
td.date { font: 13px var(--f-mono); white-space: nowrap; color: var(--muted); }
td .input.small { width: 108px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: var(--r); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 600px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.linkbox { display: flex; gap: 8px; align-items: center; min-width: 0; }
.linkbox input { font: 12px var(--f-mono); min-width: 0; flex: 1; }
.cr-row td:first-child { font-weight: 600; }
.tagline { display: flex; gap: 6px; flex-wrap: wrap; }
a.acc { color: inherit; text-decoration: none; }
a.acc:hover { color: var(--accent); text-decoration: underline; }
a.tag.acc:hover { border-color: var(--accent); }
.tag { font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; white-space: nowrap; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 99px; font-size: 14px; font-weight: 500; z-index: 20; box-shadow: 0 6px 20px rgb(0 0 0 / 0.2); max-width: calc(100% - 32px); }
.toast.bad { background: var(--bad); color: #fff; }
.loading { display: grid; place-items: center; min-height: 50vh; color: var(--muted); }
.gate { max-width: 460px; margin: 12vh auto 0; padding: 0 16px; display: grid; gap: 10px; text-align: center; justify-items: center; }
</style>

<div id="app"><div class="loading">Loading…</div></div>
<div id="toast-host"></div>

<script>window.API_URL = "https://script.google.com/macros/s/AKfycbx_F4vgPIqpplT_u7EBKyepQsIYeyg_WnheqWTqFB8qJv32waImVhw6AxcFKMXJ8YFo0w/exec";</script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var S = {};

  /* ── plumbing ───────────────────────────────────────────── */
  function api(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (window.google && google.script && google.script.run) {
        var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(new Error((e && e.message) || String(e))); });
        r[fn].apply(r, args);
      } else if (window.PREVIEW) {
        setTimeout(function () {
          try { resolve(JSON.parse(JSON.stringify(window.PREVIEW.call(fn, args)))); }
          catch (e) { reject(new Error(e.message || String(e))); }
        }, 140);
      } else if (window.API_URL) {
        fetch(window.API_URL, {
          method: 'POST', credentials: 'omit', redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ fn: fn, args: args })
        }).then(function (r) {
          if (!r.ok) throw new Error('The server didn’t answer (' + r.status + '). Try again in a moment.');
          return r.json().catch(function () { throw new Error('The server sent something unexpected. Try again in a moment.'); });
        }).then(function (j) {
          if (j && j.ok) resolve(j.data); else reject(new Error((j && j.error) || 'Something went wrong. Try again.'));
        }).catch(function (e) {
          var m = (e && e.message) || '';
          reject(new Error(/failed to fetch|networkerror|load failed|network/i.test(m) ? 'Couldn’t reach the server. Check your connection and try again.' : m));
        });
      } else reject(new Error('This page is not connected to its sheet.'));
    });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function isUrl(s) { return /^https?:\/\/\S+$/i.test(String(s || '').trim()); }
  function pad(n) { return ('0' + n).slice(-2); }
  function todayIso() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function daysAgoIso(n) { var d = new Date(); d.setDate(d.getDate() - n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function fmtDate(iso, withDay) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); if (!m) return esc(iso || '—');
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    var s = (withDay ? DAYS[d.getDay()] + ' ' : '') + d.getDate() + ' ' + MONTHS[d.getMonth()];
    return d.getFullYear() !== new Date().getFullYear() ? s + ' ' + d.getFullYear() : s;
  }
  function toDmy(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
  function fromDmy(t) {
    var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(t || '').trim()); if (!m) return '';
    var d = new Date(+m[3], +m[2] - 1, +m[1]);
    if (d.getFullYear() !== +m[3] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[1]) return '';
    return m[3] + '-' + m[2] + '-' + m[1];
  }
  function accLink(a, cls) {
    a = String(a || '').replace(/^@+/, '');
    return '<a class="' + cls + '" href="https://www.tiktok.com/@' + encodeURIComponent(a) + '" target="_blank" rel="noopener noreferrer" title="Open @' + esc(a) + ' on TikTok">@' + esc(a) + '</a>';
  }
  function shortLink(u) { var s = String(u || '').replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, ''); return s.length > 44 ? s.slice(0, 42) + '…' : s; }
  function linkHtml(u) { return isUrl(u) ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(shortLink(u)) + '</a>' : esc(u); }
  function viewsHtml(v) {
    if (!v) return '<span class="faint">—</span>';
    var cls = /flop/i.test(v) ? 'flop' : /(\d{2,}\s*k|\d+(\.\d+)?\s*m)/i.test(v) ? 'hit' : '';
    return '<span class="views ' + cls + '">' + esc(v) + '</span>';
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
  var toastTimer;
  function toast(msg, bad) {
    var host = document.getElementById('toast-host');
    host.innerHTML = '<div class="toast' + (bad ? ' bad' : '') + '" role="status">' + esc(msg) + '</div>';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { host.innerHTML = ''; }, bad ? 6000 : 2600);
  }
  function copy(text, inputId) {
    function fallback() {
      var el = inputId && document.getElementById(inputId);
      if (el) { el.focus(); el.select(); toast('Link selected. Press Ctrl/Cmd+C to copy.'); }
      else toast('Copy this: ' + text);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, fallback);
      } else fallback();
    } catch (e) { fallback(); }
  }
  function busy(on) { S.busy = on; document.body.style.cursor = on ? 'progress' : ''; }
  function call(fn, args, after) {
    if (S.busy) return;
    busy(true);
    return api.apply(null, [fn].concat(args)).then(function (res) { busy(false); after(res); }, function (e) { busy(false); toast(e.message, true); });
  }

  /* ── start ─────────────────────────────────────────────── */
  function readBoot() {
    try { var b = JSON.parse(document.getElementById('boot').textContent); if (b && b.mode) return b; } catch (e) {}
    try {
      var q = new URLSearchParams(location.search);
      if (q.get('admin')) return { mode: 'admin', key: q.get('admin') };
      if (q.get('creator')) return { mode: 'creator', key: q.get('creator') };
    } catch (e) {}
    return { mode: 'none' };
  }
  function start(boot) {
    S = { mode: boot.mode, key: boot.key, data: null, busy: false,
      view: 'campaigns', campaignId: null, filter: 'Active', postCreator: '', edit: null, editCreator: null, armed: null, result: null,
      rows: [{ link: '', date: todayIso(), account: null }], campaign: '', ctab: 'send', lastAcc: '' };
    document.body.className = boot.mode === 'creator' ? 'creator' : 'team';
    if (boot.mode === 'none') return gate('Ask the Stellar team for your link', 'This page only opens from the private link you were sent.');
    app.innerHTML = '<div class="loading">Loading…</div>';
    var fn = boot.mode === 'admin' ? 'adminView' : 'creatorView';
    api(fn, S.key).then(function (d) { S.data = d; render(); },
      function (e) { gate(boot.mode === 'admin' ? 'This team link doesn’t work' : 'This link isn’t active', e.message); });
  }
  window.__startPortal = start;
  function gate(title, msg) {
    app.innerHTML = '<div class="gate"><span class="brand"><span class="eq"><i></i><i></i><i></i><i></i></span>Creator Portal</span><h1>' + esc(title) + '</h1><p class="muted">' + esc(msg) + '</p></div>';
  }
  function render() {
    S.armedTimer && clearTimeout(S.armedTimer);
    app.innerHTML = S.mode === 'creator' ? creatorPage() : teamPage();
  }
  function brand(extra) {
    return '<span class="brand"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Creator Portal</span>' + (extra || '');
  }

  /* ── creator page ──────────────────────────────────────── */
  function creatorPage() {
    var d = S.data, tab = S.ctab || 'send';
    var active = d.campaigns.filter(function (c) { return c.status === 'Active'; });
    if (!active.some(function (c) { return c.id === S.campaign; })) S.campaign = active.length === 1 ? active[0].id : '';
    var h = '<header class="top"><div class="top-in">' + brand() + '</div></header><main class="wrap">';
    h += '<section><h1>Hi, ' + esc(d.name) + '</h1><p class="lede">Only you and the Stellar team can see this page.</p></section>';
    h += '<nav class="tabs ctabs" aria-label="Sections">' + [['send', 'Send links'], ['campaigns', 'Campaigns'], ['posts', 'My posts']].map(function (t) {
      var n = t[0] === 'campaigns' ? d.campaigns.length : t[0] === 'posts' ? d.posts.length : 0;
      return '<button type="button" data-act="ctab" data-v="' + t[0] + '"' + (tab === t[0] ? ' aria-current="page"' : '') + '>' + t[1] + (n ? ' <span class="num tab-n">' + n + '</span>' : '') + '</button>';
    }).join('') + '</nav>';

    if (tab === 'send') {
      h += '<section class="card" aria-label="Send links">';
      if (!active.length) {
        h += '<div class="empty">You’re not on an active campaign right now. The team will add you when one starts.</div>';
      } else {
        var accs = d.accounts;
        S.rows.forEach(function (r) { if (r.account == null) r.account = defaultAccount(); });
        h += '<div class="camp-pick"><label class="lbl" for="f-campaign">Campaign</label><select class="input" id="f-campaign" data-k="campaign">' +
          (active.length > 1 ? '<option value="">Choose a campaign…</option>' : '') +
          active.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === S.campaign ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select></div>';
        h += '<div class="link-rows"><div class="lr-head" aria-hidden="true"><span>Link to your post</span><span>Posted from' + (accs.length ? '' : ' <span class="faint" style="font-weight:400">(optional)</span>') + '</span><span>Date posted <span class="faint" style="font-weight:400">DD/MM/YYYY</span></span><span></span></div>' + S.rows.map(rowHtml).join('') + '</div>';
        if (!accs.length) h += '<p class="hint">Type your account once and it’s saved for next time.</p>';
        var n = S.rows.filter(function (r) { return r.link.trim(); }).length;
        h += '<div class="row-actions"><button class="btn ghost" data-act="add-row" type="button">+ Add another link</button>' +
          '<button class="btn primary" data-act="submit" type="button" id="submit-btn" style="margin-left:auto"' + (n ? '' : ' disabled') + '>' + (n > 1 ? 'Send ' + n + ' links' : 'Send link') + '</button></div>';
        if (S.result) h += resultHtml(S.result);
      }
      h += '</section>';
    }

    if (tab === 'campaigns') {
      if (!d.campaigns.length) h += '<div class="empty">You’re not on any campaigns yet.</div>';
      else h += '<section class="camp-cards" aria-label="Your campaigns">' + d.campaigns.map(function (c) {
        var mine = d.posts.filter(function (p) { return p.campaignId === c.id; }).length;
        return '<article class="camp"><div class="camp-top"><h2>' + esc(c.name) + '</h2><span class="pill ' + (c.status === 'Active' ? 'active' : 'ended') + '">' + esc(c.status) + '</span></div>' +
          (c.artist ? '<div class="muted">' + esc(c.artist) + '</div>' : '') +
          (isUrl(c.sound) ? '<a class="sound" href="' + esc(c.sound) + '" target="_blank" rel="noopener noreferrer">♪ Open the sound</a>' : (c.sound ? '<div>♪ ' + esc(c.sound) + '</div>' : '')) +
          (c.brief ? '<p class="brief">' + esc(c.brief) + '</p>' : '') +
          '<div class="row-actions camp-foot"><span class="hint">' + plural(mine, 'post') + ' sent</span>' +
          (c.status === 'Active' ? '<button class="btn sm" type="button" data-act="send-for" data-id="' + esc(c.id) + '" style="margin-left:auto">Send links for this campaign</button>' : '') + '</div></article>';
      }).join('') + '</section>';
    }

    if (tab === 'posts') {
      h += '<section class="card" aria-label="My posts">';
      if (!d.posts.length) h += '<div class="empty">Nothing yet. Links you send show up here.</div>';
      else h += '<div class="post-list">' + d.posts.map(function (p) {
        var armed = S.armed === 'del:' + p.id;
        return '<div class="post"><span class="when">' + fmtDate(p.postedOn, true) + '</span><div class="what">' + '<span class="lk">' + linkHtml(p.link) + '</span>' +
          '<span class="meta">' + esc(p.campaign) + (p.account ? ' · @' + esc(p.account) : '') + '</span></div>' +
          '<button class="btn ghost sm danger' + (armed ? ' armed' : '') + '" data-act="del-mine" data-id="' + esc(p.id) + '" type="button">' + (armed ? 'Remove?' : 'Remove') + '</button></div>';
      }).join('') + '</div>';
      h += '</section>';
    }
    return h + '</main>';
  }
  function defaultAccount() {
    var d = S.data;
    return S.lastAcc || (d.posts[0] && d.posts[0].account) || d.accounts[0] || '';
  }
  function accountCell(r, i) {
    var accs = S.data.accounts;
    if (accs.length && !r.newAcc) {
      var list = accs.indexOf(r.account) >= 0 || !r.account ? accs : [r.account].concat(accs);
      return '<select class="input" id="acc-' + i + '" data-k="acc" data-i="' + i + '" aria-label="Posted from">' +
        list.map(function (a) { return '<option value="' + esc(a) + '"' + (a === r.account ? ' selected' : '') + '>@' + esc(a) + '</option>'; }).join('') +
        '<option value="__new">+ Add another account…</option></select>';
    }
    return '<div class="acc-new"><input class="input" id="acc-' + i + '" data-k="accText" data-i="' + i + '" placeholder="@account" value="' + esc(r.account ? '@' + r.account.replace(/^@+/, '') : '') + '" autocomplete="off" aria-label="Posted from">' +
      (accs.length ? '<button class="btn ghost sm" type="button" data-act="acc-cancel" data-i="' + i + '" aria-label="Back to my accounts">↩</button>' : '') + '</div>';
  }
  function rowHtml(r, i) {
    var many = S.rows.length > 1;
    return '<div class="link-row">' +
      '<div class="lr-top"><span>' + (many ? 'Link ' + (i + 1) : 'Your link') + '</span>' +
        (many ? '<button class="btn ghost sm danger" data-act="rm-row" data-i="' + i + '" type="button">Remove</button>' : '') + '</div>' +
      '<input class="input ln" id="link-' + i + '" type="url" inputmode="url" placeholder="Paste a link, e.g. https://www.tiktok.com/t/…" value="' + esc(r.link) + '" data-k="link" data-i="' + i + '" autocomplete="off" aria-label="Link to your post">' +
      '<div class="ac"><label class="sub-m" for="acc-' + i + '">Posted from</label>' + accountCell(r, i) + '</div>' +
      '<div class="dt"><label class="sub-m" for="date-' + i + '">Date posted (DD/MM/YYYY)</label><input class="input' + (r.dateBad ? ' bad' : '') + '" id="date-' + i + '" type="date" max="' + todayIso() + '" value="' + esc(r.date) + '" data-k="date" data-i="' + i + '" aria-label="Date posted, DD/MM/YYYY"></div>' +
      (many ? '<button class="btn ghost x" data-act="rm-row" data-i="' + i + '" type="button" aria-label="Remove link ' + (i + 1) + '">×</button>' : '<span class="x-sp"></span>') +
      '</div>';
  }
  function resultHtml(r) {
    if (r.error) return '<div class="notice bad" role="alert">' + esc(r.error) + '</div>';
    var h = '';
    if (r.added) h += '<div class="notice ok" role="status">Thanks! ' + plural(r.added, 'link') + ' sent. <button class="linkish" type="button" data-act="ctab" data-v="posts">See my posts</button></div>';
    if (r.skipped && r.skipped.length) h += '<div class="notice warn" role="alert">' + plural(r.skipped.length, 'link') + ' weren’t sent:<ul>' +
      r.skipped.map(function (s) { return '<li><span class="mono">' + esc(shortLink(s.link) || '(empty)') + '</span>: ' + esc(s.reason) + '</li>'; }).join('') + '</ul></div>';
    return h;
  }
  function submitLinks() {
    if (!S.campaign) { S.result = { error: 'Choose which campaign these posts are for.' }; return render(); }
    var items = S.rows.filter(function (r) { return r.link.trim(); }).map(function (r) {
      return { link: r.link, date: r.date, account: String(r.account || '').trim().replace(/^@+/, '') };
    });
    var bad = false;
    S.rows.forEach(function (r) { if (r.link.trim()) { r.dateBad = !r.date || r.date > todayIso(); if (r.dateBad) bad = true; } });
    if (bad) { S.result = { error: 'Add the date each post went live (it can’t be in the future).' }; return render(); }
    var btn = document.getElementById('submit-btn'); if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
    call('submitPosts', [S.key, S.campaign, items], function (res) {
      S.data = res.view; S.result = { added: res.added, skipped: res.skipped };
      if (items.length && items[items.length - 1].account) S.lastAcc = items[items.length - 1].account;
      var failed = {}; res.skipped.forEach(function (s) { failed[s.link] = true; });
      S.rows = S.rows.filter(function (r) { return failed[r.link.trim()]; });
      S.rows.forEach(function (r) { r.newAcc = false; r.account = String(r.account || '').replace(/^@+/, ''); });
      if (!S.rows.length) S.rows = [{ link: '', date: todayIso(), account: null }];
      render();
    });
  }

  /* ── team page ─────────────────────────────────────────── */
  function teamPage() {
    var h = '<header class="top"><div class="top-in">' + brand(' <span class="badge">Team view</span>') +
      '<nav class="tabs" aria-label="Sections"><button type="button" data-act="tab" data-v="campaigns"' + (S.view !== 'creators' ? ' aria-current="page"' : '') + '>Campaigns</button>' +
      '<button type="button" data-act="tab" data-v="creators"' + (S.view === 'creators' ? ' aria-current="page"' : '') + '>Creators</button></nav></div></header><main class="wrap">';
    if (S.view === 'creators') h += creatorsTab();
    else if (S.campaignId && campaignById(S.campaignId)) h += campaignDetail(campaignById(S.campaignId));
    else h += campaignList();
    return h + '</main>';
  }
  function campaignById(id) { return S.data.campaigns.filter(function (c) { return c.id === id; })[0]; }
  function creatorById(id) { return S.data.creators.filter(function (c) { return c.id === id; })[0]; }
  function membersOf(cid) { return S.data.members.filter(function (m) { return m.campaignId === cid; }); }
  function postsOf(cid) { return S.data.posts.filter(function (p) { return p.campaignId === cid; }); }

  function campaignList() {
    var d = S.data, f = S.filter;
    var nActive = d.campaigns.filter(function (c) { return c.status === 'Active'; }).length;
    var list = d.campaigns.filter(function (c) { return f === 'All' || c.status === f; });
    list.sort(function (a, b) { return lastPost(b.id).localeCompare(lastPost(a.id)) || a.name.localeCompare(b.name); });
    var h = '<section><h1>Campaigns</h1><div class="summary" style="margin-top:10px"><span><b>' + nActive + '</b> active</span><span><b>' + d.creators.length + '</b> creators</span><span><b>' + d.posts.length + '</b> links logged</span></div></section>';
    if (S.edit && !S.edit.id) h += campaignForm(S.edit);
    h += '<div class="toolbar"><div class="chips" role="group" aria-label="Filter campaigns">' + ['Active', 'Ended', 'All'].map(function (k) {
      var n = k === 'All' ? d.campaigns.length : d.campaigns.filter(function (c) { return c.status === k; }).length;
      return '<button type="button" class="chip" data-act="filter" data-v="' + k + '" aria-pressed="' + (f === k) + '">' + k + ' <span class="num">' + n + '</span></button>';
    }).join('') + '</div>' + (S.edit && !S.edit.id ? '' : '<button class="btn primary" type="button" data-act="new-campaign">+ New campaign</button>') + '</div>';
    if (!list.length) return h + '<div class="empty">' + (d.campaigns.length ? 'No ' + f.toLowerCase() + ' campaigns.' : 'No campaigns yet. Create the first one, then tick which creators are on it.') + '</div>';
    h += '<div class="clist"><div class="crow head" aria-hidden="true"><span>Campaign</span><span>Status</span><span>Creators</span><span>Links</span><span>Last post</span><span></span></div>';
    h += list.map(function (c) {
      var lp = lastPost(c.id);
      return '<button type="button" class="crow" data-act="open" data-id="' + esc(c.id) + '"><span><span class="nm">' + esc(c.name) + '</span>' + (c.artist ? '<br><span class="ar">' + esc(c.artist) + '</span>' : '') + '</span>' +
        '<span class="c-st"><span class="pill ' + (c.status === 'Active' ? 'active' : 'ended') + '">' + esc(c.status) + '</span></span>' +
        '<span class="crow-meta"><span class="n c-n">' + membersOf(c.id).length + '</span><span class="n c-l">' + postsOf(c.id).length + '</span>' +
        '<span class="c-last mono">' + (lp ? fmtDate(lp) : '—') + '</span></span><span class="chev" aria-hidden="true">›</span></button>';
    }).join('') + '</div>';
    return h;
  }
  function lastPost(cid) { var p = postsOf(cid); return p.length ? p.map(function (x) { return x.postedOn; }).sort().pop() : ''; }

  function campaignForm(e) {
    var isNew = !e.id;
    return '<section class="card" aria-labelledby="cf-h"><h2 id="cf-h">' + (isNew ? 'New campaign' : 'Edit campaign') + '</h2><div class="form-grid">' +
      '<div><label class="lbl" for="e-name">Campaign name</label><input class="input" id="e-name" data-e="name" value="' + esc(e.name || '') + '" placeholder="e.g. Shygirl – Alyse"></div>' +
      '<div><label class="lbl" for="e-artist">Artist</label><input class="input" id="e-artist" data-e="artist" value="' + esc(e.artist || '') + '"></div>' +
      '<div class="full"><label class="lbl" for="e-sound">Sound link</label><input class="input" id="e-sound" data-e="sound" type="url" value="' + esc(e.sound || '') + '" placeholder="https://www.tiktok.com/music/…"></div>' +
      '<div class="full"><label class="lbl" for="e-brief">Brief for creators</label><textarea class="input" id="e-brief" data-e="brief" placeholder="What to post, captions, hashtags…">' + esc(e.brief || '') + '</textarea></div>' +
      '<div><label class="lbl" for="e-status">Status</label><select class="input" id="e-status" data-e="status"><option' + (e.status !== 'Ended' ? ' selected' : '') + '>Active</option><option' + (e.status === 'Ended' ? ' selected' : '') + '>Ended</option></select></div>' +
      '</div><p class="hint">Creators on this campaign see its name, artist, sound and brief. Ended campaigns stop taking new links.</p>' +
      '<div class="row-actions"><button class="btn primary" type="button" data-act="save-campaign">' + (isNew ? 'Create campaign' : 'Save changes') + '</button><button class="btn ghost" type="button" data-act="cancel-edit">Cancel</button></div></section>';
  }

  function campaignDetail(c) {
    var d = S.data, mem = {}, posts = postsOf(c.id);
    membersOf(c.id).forEach(function (m) { mem[m.creatorId] = true; });
    var week = daysAgoIso(6);
    var h = '<button class="back" type="button" data-act="back">← All campaigns</button>';
    if (S.edit && S.edit.id === c.id) h += campaignForm(S.edit);
    else {
      h += '<section style="display:grid;gap:8px"><div class="detail-head"><h1>' + esc(c.name) + '</h1><span class="pill ' + (c.status === 'Active' ? 'active' : 'ended') + '">' + esc(c.status) + '</span>' +
        '<div class="row-actions"><button class="btn" type="button" data-act="edit-campaign">Edit</button></div></div>' +
        '<div class="row-actions muted">' + (c.artist ? '<span>' + esc(c.artist) + '</span>' : '') + (isUrl(c.sound) ? '<a class="sound" href="' + esc(c.sound) + '" target="_blank" rel="noopener noreferrer">♪ Sound</a>' : '') + '</div>' +
        (c.brief ? '<p class="brief" style="max-width:70ch">' + esc(c.brief) + '</p>' : '') + '</section>';
    }
    h += '<div class="stats"><div class="stat"><div class="k">Creators</div><div class="v">' + Object.keys(mem).length + '</div></div>' +
      '<div class="stat"><div class="k">Links logged</div><div class="v">' + posts.length + '</div></div>' +
      '<div class="stat"><div class="k">Posted last 7 days</div><div class="v">' + posts.filter(function (p) { return p.postedOn >= week; }).length + '</div></div></div>';

    h += '<section class="card" aria-labelledby="who-h"><div class="card-head"><h2 id="who-h">Who’s on this campaign</h2><span class="hint">Tick a creator to add them. They’ll see it on their page right away.</span></div>';
    if (!d.creators.length) h += '<div class="empty">No creators yet. Add them in the Creators tab first.</div>';
    else h += '<div class="people">' + d.creators.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (cr) {
      var on = !!mem[cr.id];
      return '<label class="person' + (on ? ' on' : '') + '"><input type="checkbox" id="m-' + esc(cr.id) + '" data-act="member" data-id="' + esc(cr.id) + '"' + (on ? ' checked' : '') + '>' + esc(cr.name) + '</label>';
    }).join('') + '</div>';
    h += '</section>';

    var who = S.postCreator, shown = posts.filter(function (p) { return !who || p.creatorId === who; });
    var posters = {}; posts.forEach(function (p) { posters[p.creatorId] = p.creator; });
    h += '<section class="card" aria-labelledby="links-h"><div class="card-head"><div class="section-title"><h2 id="links-h">Links</h2><span class="count">' + shown.length + '</span></div>' +
      '<div class="row-actions"><select class="input small" id="post-filter" data-k="postCreator" aria-label="Filter by creator" style="width:auto"><option value="">All creators</option>' +
      Object.keys(posters).map(function (id) { var cr = creatorById(id); return '<option value="' + esc(id) + '"' + (who === id ? ' selected' : '') + '>' + esc(cr ? cr.name : posters[id]) + '</option>'; }).join('') +
      '</select>' + (shown.length ? '<button class="btn sm" type="button" data-act="copy-links">Copy links</button>' : '') + '</div></div>';
    if (!shown.length) h += '<div class="empty">No links yet. They appear here as soon as a creator sends them.</div>';
    var hasAcc = shown.some(function (p) { return p.account; });
    if (shown.length) h += '<div class="table-wrap"><table><thead><tr><th>Posted</th><th>Creator</th>' + (hasAcc ? '<th>Account</th>' : '') + '<th>Link</th><th>Views</th><th>Sent</th><th></th></tr></thead><tbody>' +
      shown.map(function (p) {
        var cr = creatorById(p.creatorId), armed = S.armed === 'delp:' + p.id;
        return '<tr><td class="date">' + fmtDate(p.postedOn, true) + '</td><td>' + esc(cr ? cr.name : p.creator) + '</td>' + (hasAcc ? '<td class="muted">' + (p.account ? accLink(p.account, 'acc') : '—') + '</td>' : '') +
          '<td class="lk">' + linkHtml(p.link) + '</td>' +
          '<td><input class="input small mono" id="v-' + esc(p.id) + '" data-views="' + esc(p.id) + '" value="' + esc(p.views) + '" placeholder="—" aria-label="Views"></td>' +
          '<td class="date faint">' + esc(String(p.submitted || '').slice(0, 10) === p.postedOn ? 'same day' : fmtDate(String(p.submitted || '').slice(0, 10))) + '</td>' +
          '<td><button class="btn ghost sm danger' + (armed ? ' armed' : '') + '" type="button" data-act="del-post" data-id="' + esc(p.id) + '">' + (armed ? 'Delete?' : 'Delete') + '</button></td></tr>';
      }).join('') + '</tbody></table></div>';
    h += '</section>';
    if (!posts.length) {
      var armedC = S.armed === 'delc:' + c.id;
      h += '<div><button class="btn sm danger' + (armedC ? ' armed' : '') + '" type="button" data-act="del-campaign">' + (armedC ? 'Click again to delete this campaign' : 'Delete campaign') + '</button></div>';
    }
    return h;
  }

  function creatorsTab() {
    var d = S.data, h = '<section><h1>Creators</h1><p class="lede">Everyone gets their own private link. It only shows the campaigns you put them on and the links they sent themselves.</p></section>';
    if (!d.baseUrl) h += '<section class="card" aria-labelledby="url-h" style="border-color:var(--accent)"><h2 id="url-h">One-time step: paste your app link</h2>' +
      '<p class="hint">In the Apps Script editor, go to <b>Deploy → Manage deployments</b> and copy the <b>Web app</b> URL (it ends in /exec). Creator links are built from it.</p>' +
      '<div class="row-actions" style="flex-wrap:nowrap"><input class="input" id="app-url" placeholder="https://script.google.com/macros/s/…/exec" style="flex:1" autocomplete="off">' +
      '<button class="btn primary" type="button" data-act="save-appurl">Save</button></div></section>';
    h += '<section class="card" aria-labelledby="add-h"><h2 id="add-h">Add a creator</h2><p class="hint">After adding, click Edit to list their accounts so they can pick from a dropdown.</p><div class="row-actions" style="flex-wrap:nowrap"><input class="input" id="new-creator" placeholder="Name, e.g. Alyssa" style="flex:1" autocomplete="off">' +
      '<button class="btn primary" type="button" data-act="add-creator">Add</button></div></section>';
    if (!d.creators.length) return h + '<div class="empty">No creators yet.</div>';
    var list = d.creators.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
    h += '<section class="card"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Accounts</th><th>Campaigns</th><th>Links</th><th>Private link</th><th></th></tr></thead><tbody>' + list.map(function (cr) {
      var camps = d.members.filter(function (m) { return m.creatorId === cr.id; }).map(function (m) { var c = campaignById(m.campaignId); return c ? c.name : ''; }).filter(Boolean);
      var nPosts = d.posts.filter(function (p) { return p.creatorId === cr.id; }).length;
      var editing = S.editCreator === cr.id, armedR = S.armed === 'reset:' + cr.id, armedD = S.armed === 'delcr:' + cr.id;
      var accs = cr.accounts || [];
      return '<tr class="cr-row"><td>' + (editing ? '<input class="input small" style="width:150px" id="rn-' + esc(cr.id) + '" value="' + esc(cr.name) + '" aria-label="Name">' : esc(cr.name)) + '</td>' +
        '<td style="min-width:180px">' + (editing
          ? '<div class="row-actions" style="flex-wrap:nowrap"><input class="input small" style="width:220px" id="ac-' + esc(cr.id) + '" value="' + esc(accs.map(function (a) { return '@' + a; }).join(', ')) + '" placeholder="@account1, @account2" aria-label="Accounts"><button class="btn sm primary" type="button" data-act="save-name" data-id="' + esc(cr.id) + '">Save</button></div>'
          : (accs.length ? '<div class="tagline">' + accs.map(function (a) { return accLink(a, 'tag acc'); }).join('') + '</div>' : '<span class="faint">None yet</span>')) + '</td>' +
        '<td><div class="tagline">' + (camps.length ? camps.map(function (n) { return '<span class="tag">' + esc(n) + '</span>'; }).join('') : '<span class="faint">None</span>') + '</div></td>' +
        '<td class="num mono">' + nPosts + '</td>' +
        '<td style="min-width:240px">' + (cr.link ? '<div class="linkbox"><input class="input small" readonly id="lk-' + esc(cr.id) + '" value="' + esc(cr.link) + '" aria-label="Private link for ' + esc(cr.name) + '"><button class="btn sm" type="button" data-act="copy-link" data-id="' + esc(cr.id) + '">Copy</button></div>' : '<span class="faint">Paste your app link above first</span>') + '</td>' +
        '<td><div class="row-actions" style="flex-wrap:nowrap">' +
        (editing ? '<button class="btn ghost sm" type="button" data-act="cancel-cr">Cancel</button>' : '<button class="btn ghost sm" type="button" data-act="rename" data-id="' + esc(cr.id) + '">Edit</button>') +
        '<button class="btn ghost sm' + (armedR ? ' danger armed' : '') + '" type="button" data-act="reset" data-id="' + esc(cr.id) + '" title="Makes a new link and switches off the old one">' + (armedR ? 'Old link stops working. Confirm' : 'New link') + '</button>' +
        (nPosts ? '' : '<button class="btn ghost sm danger' + (armedD ? ' armed' : '') + '" type="button" data-act="del-creator" data-id="' + esc(cr.id) + '">' + (armedD ? 'Delete?' : 'Delete') + '</button>') +
        '</div></td></tr>';
    }).join('') + '</tbody></table></div></section>';
    return h;
  }

  /* ── events ────────────────────────────────────────────── */
  function arm(key) {
    if (S.armed === key) return true;
    S.armed = key; render();
    clearTimeout(S.armedTimer); S.armedTimer = setTimeout(function () { if (S.armed === key) { S.armed = null; render(); } }, 4000);
    return false;
  }
  function setData(d) { S.data = d; S.armed = null; render(); }
  var actions = {
    'add-row': function () { var prev = S.rows[S.rows.length - 1]; S.rows.push({ link: '', date: prev.date || todayIso(), account: prev.account, newAcc: prev.newAcc }); S.result = null; render(); var el = document.getElementById('link-' + (S.rows.length - 1)); if (el) el.focus(); },
    'acc-cancel': function (el) { var r = S.rows[+el.dataset.i]; r.newAcc = false; r.account = defaultAccount(); render(); },
    'ctab': function (el) { S.ctab = el.dataset.v; S.armed = null; if (el.dataset.v !== 'send') S.result = null; render(); window.scrollTo(0, 0); },
    'send-for': function (el) { S.campaign = el.dataset.id; S.ctab = 'send'; S.result = null; render(); window.scrollTo(0, 0); var i = document.getElementById('link-0'); if (i) i.focus(); },
    'rm-row': function (el) { S.rows.splice(+el.dataset.i, 1); render(); },
    'submit': submitLinks,
    'del-mine': function (el) { if (!arm('del:' + el.dataset.id)) return; call('deleteMyPost', [S.key, el.dataset.id], function (d) { S.data = d; S.armed = null; S.result = null; render(); toast('Removed'); }); },
    'tab': function (el) { S.view = el.dataset.v; S.campaignId = null; S.edit = null; S.armed = null; render(); window.scrollTo(0, 0); },
    'filter': function (el) { S.filter = el.dataset.v; render(); },
    'open': function (el) { S.campaignId = el.dataset.id; S.postCreator = ''; S.edit = null; render(); window.scrollTo(0, 0); },
    'back': function () { S.campaignId = null; S.edit = null; render(); },
    'new-campaign': function () { S.edit = { name: '', artist: '', sound: '', brief: '', status: 'Active' }; render(); var el = document.getElementById('e-name'); if (el) el.focus(); },
    'edit-campaign': function () { var c = campaignById(S.campaignId); S.edit = { id: c.id, name: c.name, artist: c.artist, sound: c.sound, brief: c.brief, status: c.status }; render(); },
    'cancel-edit': function () { S.edit = null; render(); },
    'save-campaign': function () {
      var e = S.edit; if (!String(e.name || '').trim()) { toast('Give the campaign a name.', true); return; }
      call('adminSaveCampaign', [S.key, e], function (d) {
        if (!e.id) { var created = d.campaigns.filter(function (c) { return c.name === e.name.trim(); }).pop(); if (created) S.campaignId = created.id; S.filter = e.status === 'Ended' ? 'Ended' : 'Active'; }
        S.edit = null; setData(d); toast(e.id ? 'Saved' : 'Campaign created. Now tick who’s on it.');
      });
    },
    'del-campaign': function () { if (!arm('delc:' + S.campaignId)) return; call('adminDeleteCampaign', [S.key, S.campaignId], function (d) { S.campaignId = null; setData(d); toast('Campaign deleted'); }); },
    'del-post': function (el) { if (!arm('delp:' + el.dataset.id)) return; call('adminDeletePost', [S.key, el.dataset.id], function (d) { setData(d); toast('Link deleted'); }); },
    'copy-links': function () {
      var who = S.postCreator, list = postsOf(S.campaignId).filter(function (p) { return !who || p.creatorId === who; });
      copy(list.map(function (p) { return p.link; }).join('\n'));
    },
    'add-creator': function () {
      var el = document.getElementById('new-creator'), name = el && el.value.trim();
      if (!name) { toast('Type a name first.', true); return; }
      call('adminSaveCreator', [S.key, { name: name }], function (d) { setData(d); toast(name + ' added. Copy their link and send it to them.'); });
    },
    'save-appurl': function () {
      var el = document.getElementById('app-url'), v = el && el.value.trim();
      if (!v) { toast('Paste the Web app URL first.', true); return; }
      call('adminSetAppUrl', [S.key, v], function (d) { setData(d); toast('Saved. Creator links are ready to copy.'); });
    },
    'copy-link': function (el) { var cr = creatorById(el.dataset.id); copy(cr.link, 'lk-' + cr.id); },
    'rename': function (el) { S.editCreator = el.dataset.id; render(); var i = document.getElementById('rn-' + el.dataset.id); if (i) { i.focus(); i.select(); } },
    'save-name': function (el) {
      var i = document.getElementById('rn-' + el.dataset.id), ac = document.getElementById('ac-' + el.dataset.id), cr = creatorById(el.dataset.id);
      call('adminSaveCreator', [S.key, { id: cr.id, name: i.value, notes: cr.notes, accounts: ac ? ac.value : cr.accounts }], function (d) { S.editCreator = null; setData(d); toast('Saved'); });
    },
    'cancel-cr': function () { S.editCreator = null; render(); },
    'reset': function (el) { if (!arm('reset:' + el.dataset.id)) return; call('adminResetLink', [S.key, el.dataset.id], function (d) { setData(d); toast('New link made. Send it to them; the old one no longer works.'); }); },
    'del-creator': function (el) { if (!arm('delcr:' + el.dataset.id)) return; call('adminDeleteCreator', [S.key, el.dataset.id], function (d) { setData(d); toast('Creator deleted'); }); }
  };
  app.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.dataset.act === 'member') return;
    if (S.busy) return;
    var fn = actions[el.dataset.act]; if (fn) { ev.preventDefault(); fn(el); }
  });
  app.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.dataset.act === 'member') {
      var on = el.checked;
      el.closest('.person').classList.toggle('on', on);
      call('adminSetMember', [S.key, S.campaignId, el.dataset.id, on], function (d) { var cr = creatorById(el.dataset.id); setData(d); toast((cr ? cr.name : 'Creator') + (on ? ' added to' : ' removed from') + ' this campaign'); });
      return;
    }
    if (el.dataset.views) {
      var p = S.data.posts.filter(function (x) { return x.id === el.dataset.views; })[0];
      if (p && p.views !== el.value.trim()) call('adminUpdatePost', [S.key, p.id, { views: el.value.trim() }], function (d) { S.data = d; toast('Views saved'); });
      return;
    }
    if (el.dataset.k === 'campaign') { S.campaign = el.value; S.result = null; return; }
    if (el.dataset.k === 'acc' && S.rows[+el.dataset.i]) {
      var row = S.rows[+el.dataset.i], idx = +el.dataset.i;
      if (el.value === '__new') { row.newAcc = true; row.account = ''; render(); var n = document.getElementById('acc-' + idx); if (n) n.focus(); }
      else row.account = el.value;
      return;
    }
    if (el.dataset.k === 'postCreator') { S.postCreator = el.value; render(); return; }
    if (el.dataset.e) { S.edit[el.dataset.e] = el.value; }
  });
  app.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.dataset.e && S.edit) { S.edit[el.dataset.e] = el.value; return; }
    if (el.dataset.k === 'accText' && S.rows[+el.dataset.i]) { S.rows[+el.dataset.i].account = el.value.trim().replace(/^@+/, ''); return; }
    if (el.dataset.k === 'dateText' && S.rows[+el.dataset.i]) {
      var dg = el.value.replace(/\D/g, '').slice(0, 8);
      var f = dg.slice(0, 2) + (dg.length > 2 ? '/' + dg.slice(2, 4) : '') + (dg.length > 4 ? '/' + dg.slice(4) : '');
      if (f !== el.value) el.value = f;
      var row = S.rows[+el.dataset.i]; row.dateText = f; row.date = fromDmy(f);
      if (row.dateBad && row.date) { row.dateBad = false; el.classList.remove('bad'); }
      return;
    }
    if (el.dataset.k && el.dataset.i != null && S.rows[+el.dataset.i]) {
      S.rows[+el.dataset.i][el.dataset.k] = el.value;
      if (el.dataset.k === 'link') {
        var n = S.rows.filter(function (r) { return r.link.trim(); }).length, btn = document.getElementById('submit-btn');
        if (btn) { btn.disabled = !n; btn.textContent = n > 1 ? 'Send ' + n + ' links' : 'Send link'; }
      }
    }
  });
  app.addEventListener('focusout', function (ev) {
    var el = ev.target;
    if (el.dataset && el.dataset.k === 'dateText' && S.rows[+el.dataset.i]) {
      var row = S.rows[+el.dataset.i];
      row.dateBad = !!(row.dateText && !row.date) || (row.date > todayIso());
      el.classList.toggle('bad', row.dateBad);
    }
  });
  app.addEventListener('paste', function (ev) {
    var el = ev.target;
    if (el.dataset.k !== 'link') return;
    var text = (ev.clipboardData || window.clipboardData).getData('text') || '';
    var urls = text.match(/https?:\/\/[^\s,;]+/gi) || [];
    if (urls.length < 2) return;
    ev.preventDefault();
    var i = +el.dataset.i, base = S.rows[i];
    var fresh = urls.map(function (u) { return { link: u, date: base.date || todayIso(), account: base.account, newAcc: base.newAcc }; });
    S.rows.splice.apply(S.rows, [i, 1].concat(fresh));
    S.result = null; render();
    toast(urls.length + ' links added. Check the dates before sending.');
  });
  app.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target.id === 'new-creator') { ev.preventDefault(); actions['add-creator'](); }
    if (ev.key === 'Enter' && ev.target.id && (ev.target.id.indexOf('rn-') === 0 || ev.target.id.indexOf('ac-') === 0)) { ev.preventDefault(); actions['save-name']({ dataset: { id: ev.target.id.slice(3) } }); }
    if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.views) { ev.target.blur(); }
  });

  if (window.PREVIEW && window.PREVIEW.ready) window.PREVIEW.ready(start);
  else start(readBoot());
})();
</script>

</body>
